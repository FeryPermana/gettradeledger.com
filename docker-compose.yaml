version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: tradeledger-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: tradeledger
    volumes:
      - tradeledger_mysql_data:/var/lib/mysql
    networks:
      - tradeledger_net

  redis:
    image: redis:7-alpine
    container_name: tradeledger-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - tradeledger_net

networks:
  tradeledger_net:
    driver: bridge

volumes:
  tradeledger_mysql_data: